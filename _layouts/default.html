<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
<style>
:root{color-scheme:light;--paper:#faf9f6;--ink:#292b29;--muted:#71756e;--line:#ddded6;--accent:#38554a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC","STSong",Georgia,serif;font-size:18px;line-height:2}a{color:inherit;text-decoration:none}a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:6px}a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}.wrap{max-width:900px;margin:auto;padding:0 32px}.masthead{display:flex;justify-content:space-between;align-items:center;padding:32px 0;border-bottom:1px solid var(--line);gap:20px}.brand{font-size:20px;letter-spacing:.12em}.nav,.meta,footer,.eyebrow{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:14px;color:var(--muted)}.nav a{margin-left:22px}.intro{padding:80px 0 64px;max-width:650px}.eyebrow{letter-spacing:.22em;color:var(--accent)}h1{font-size:clamp(32px,5vw,48px);font-weight:500;line-height:1.5;letter-spacing:.06em;margin:18px 0 24px}h2{font-size:26px;font-weight:500;line-height:1.6}.intro p{color:var(--muted);margin:0}.section-label{font-size:14px;font-weight:400;letter-spacing:.2em;border-bottom:1px solid var(--line);padding-bottom:15px;color:var(--muted)}.entry{display:grid;grid-template-columns:120px 1fr;gap:28px;padding:32px 0;border-bottom:1px solid var(--line)}.entry h2{margin:0 0 12px}.entry p{margin:0;color:var(--muted);font-size:17px;line-height:1.9}.read{display:inline-block;margin-top:16px;font-size:14px;color:var(--accent)}.article{max-width:680px;margin:64px auto 80px}.article header{margin-bottom:42px}.prose{font-size:19px;line-height:2.15;overflow-wrap:anywhere}.prose p{margin:0 0 1.6em}.prose blockquote{border-left:2px solid var(--accent);margin:30px 0;padding-left:24px;color:var(--muted)}.prose img{max-width:100%;height:auto}.prose pre{overflow:auto;font-size:15px}.back{display:inline-block;margin-top:32px;color:var(--accent);font-size:15px}footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:26px 0;margin-top:70px;margin-bottom:25px}::selection{background:#dbe5de}@media(max-width:600px){.wrap{padding:0 24px}.masthead{padding:24px 0}.brand{font-size:17px}.intro{padding:52px 0 42px}.entry{grid-template-columns:1fr;gap:8px;padding:26px 0}.article{margin-top:40px}.prose{font-size:18px}.nav a{margin-left:12px}footer{flex-direction:column;gap:2px}}
</style></head>
<body><div class="wrap"><header class="masthead"><a class="brand" href="{{ '/' | relative_url }}">Nino 的散文簿</a><nav class="nav" aria-label="主导航"><a href="{{ '/' | relative_url }}">首页</a><a href="{{ '/#essays' | relative_url }}">文字</a></nav></header>
<main id="main">{% if page.home %}{{ content }}{% else %}<article class="article"><header><div class="meta">{% if page.date %}{{ page.date | date: '%Y.%m.%d' }} · {% endif %}{{ page.category | default: '随笔' }}</div><h1>{{ page.title }}</h1></header><div class="prose">{{ content }}</div><a class="back" href="{{ '/' | relative_url }}">← 回到散文簿</a></article>{% endif %}</main>
<footer><span>© {{ 'now' | date: '%Y' }} Nino · 散文簿</span><span>在日常里，留住一点光。</span></footer></div></body></html>
